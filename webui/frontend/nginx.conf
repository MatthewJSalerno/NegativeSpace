# The web container: serves the built screens and passes the API to the app
# container, which runs the API and the engine (docker-compose.yml).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve "app" at request time through Docker's DNS, so the web container
    # starts even when the app container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:8000;

    # The live job feed. The server sends only when something changes, so an idle
    # job can be quiet for minutes: keep the connection open for up to an hour.
    location /api/v1/ws/ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A first detail preview runs the engine; allow for a large RAW file.
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # Built files carry a content hash in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a screen of the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
