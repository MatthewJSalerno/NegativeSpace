# Independent demo instance. Use only a sample source and dedicated writable dirs.
# See tests/README.md, "Shareable sample instance".
name: ns-sample-share
services:
  web:
    image: ${SAMPLE_WEB_IMAGE:-negativespace-web:inspector-tabs}
    ports:
      - "${SAMPLE_BIND:-127.0.0.1}:${SAMPLE_PORT:-8082}:8080"
    depends_on: [app]
    restart: unless-stopped
  app:
    image: ${SAMPLE_APP_IMAGE:-negativespace:inspector-tabs}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${SAMPLE_SOURCE:?Set SAMPLE_SOURCE}
        target: /data/source
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${SAMPLE_DEST:?Set SAMPLE_DEST}
        target: /data/dest
        bind: {create_host_path: false}
      - type: bind
        source: ${SAMPLE_APPDATA:?Set SAMPLE_APPDATA}
        target: /appdata
        bind: {create_host_path: false}
      - type: bind
        source: ${SAMPLE_CACHE:?Set SAMPLE_CACHE}
        target: /cache
        bind: {create_host_path: false}
      - type: bind
        source: ${SAMPLE_BACKUPS:?Set SAMPLE_BACKUPS}
        target: /backups
        bind: {create_host_path: false}
    restart: unless-stopped
    stop_grace_period: 5m
