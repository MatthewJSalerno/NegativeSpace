# NegativeSpace as two containers:
#   web  - the screens, served by nginx on port 8080; passes /api to app.
#   app  - the API and the engine it runs, with every volume. The API starts the
#          engine as a child process and both use the catalog and its lock file,
#          so they share one container. Its port is not published.
#
# Set SOURCE_DIR, DEST_DIR, APPDATA_DIR and BACKUP_DIR to absolute host paths, then
# run `docker compose -f docker/compose.yml up -d --build` from the repository root
# (or `docker compose up -d --build` from this folder) and open http://localhost:8080.
#
# Source/destination must be distinct, non-overlapping directories.
# BACKUP_DIR and APPDATA_DIR must also be distinct and non-overlapping:
# neither may contain the other, including through symlinks or mount aliases.
# Different container paths do not ensure separate backing storage.
# /backups holds multiple catalog snapshots, NOT photos. The engine writes one
# after every job that recorded changes and on --backup-now, and refuses (records a
# failed backup) when /backups is missing, unmounted, unwritable or overlaps /appdata.
# The project name is fixed, not taken from this folder's name ("docker"): containers
# and volumes stay negativespace-* wherever the file lives or is started from.
name: negativespace

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: negativespace-web
    ports:
      - "8080:8080"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    image: negativespace
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${SOURCE_DIR:?Set SOURCE_DIR to the source directory}
        target: /data/source
        # Scan and Copy need only read access. Move deletes verified sources, so it
        # needs read_only: false; with a read-only source every Move file fails.
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEST_DIR:?Set DEST_DIR to the destination directory}
        target: /data/dest
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_DIR:?Set APPDATA_DIR to the application data directory}
        target: /appdata
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR to a separate backup directory}
        target: /backups
        bind:
          create_host_path: false
      # Thumbnails: disposable, rebuilt from the photos, so a named volume is enough.
      # It keeps them when the container is replaced.
      - cache:/cache
    # Restarting never restarts a job: jobs start only from the web interface.
    restart: unless-stopped
    # docker stop cancels a running job and, by default, kills the container 10 s
    # later. A graceful cancel finishes the file being copied, records the rest
    # Cancelled and takes a catalog backup; a large file over a network share can
    # outlast 10 s, and a kill mid-cancel leaves the run Interrupted instead.
    stop_grace_period: 5m

volumes:
  cache:
