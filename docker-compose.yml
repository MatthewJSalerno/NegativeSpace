# Set SOURCE_DIR, DEST_DIR, APPDATA_DIR and BACKUP_DIR to absolute host paths.
# Source/destination must be distinct, non-overlapping directories.
# BACKUP_DIR and APPDATA_DIR must also be distinct and non-overlapping:
# neither may contain the other, including through symlinks or mount aliases.
# Different container paths do not ensure separate backing storage.
# /backups holds multiple catalog snapshots, NOT photos. The engine writes one
# after every job that recorded changes and on --backup-now, and refuses (records a
# failed backup) when /backups is missing, unmounted, unwritable or overlaps /appdata.
#
# Start with `docker compose up -d`, then open http://localhost:8080.
services:
  negativespace:
    build: .
    ports:
      - "8080:8080"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${SOURCE_DIR:?Set SOURCE_DIR to the source directory}
        target: /data/source
        # Scan and Copy need only read access. Move deletes verified sources, so it
        # needs read_only: false; with a read-only source every Move file fails.
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DEST_DIR:?Set DEST_DIR to the destination directory}
        target: /data/dest
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_DIR:?Set APPDATA_DIR to the application data directory}
        target: /appdata
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_DIR:?Set BACKUP_DIR to a separate backup directory}
        target: /backups
        bind:
          create_host_path: false
    # The web server (the image's default command). Restarting it never restarts
    # a job: jobs start only when you start them in the web interface.
    restart: unless-stopped
    # docker stop cancels a running job and, by default, kills the container 10 s
    # later. A graceful cancel finishes the file being copied, records the rest
    # Cancelled and takes a catalog backup; a large file over a network share can
    # outlast 10 s, and a kill mid-cancel leaves the run Interrupted instead.
    stop_grace_period: 5m
