name: Engine tests

# The engine smoke coverage requires
# ExifTool, Pillow, rawpy and imagehash — which is exactly what the image
# provides. Running it here rather than relying on someone remembering keeps it
# from rotting once the web UI adds a second codebase to the repo.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke suite (in container)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Also the only automated check that docker/app.Dockerfile itself still builds.
      - name: Build image
        run: docker build -f docker/app.Dockerfile -t negativespace .

      - name: Build the web image
        run: docker build -f docker/web.Dockerfile -t negativespace-web .

      - name: A container CPU limit sets the default worker count
        # os.cpu_count() reports the host; the engine must use what --cpus allows.
        run: |
          got=$(docker run --rm --cpus 2 --entrypoint python3 negativespace -c \
                "from engine import ns_db; c = ns_db.available_cpus(); print(c['available'], c['limited_by'])")
          echo "with --cpus 2: $got"
          if [ "$got" != "2 cpu_quota" ] && [ "$(nproc)" -gt 2 ]; then
            echo "::error::the engine ignored the container's CPU limit"; exit 1
          fi

      - name: Engine starts and parses its CLI
        run: docker run --rm negativespace python3 -m engine --help

      - name: Timezone database is present
        # Without tzdata, -e TZ=<zone> is silently ignored and the container
        # stays on UTC — which quietly changes date bucketing. Assert the
        # variable actually takes effect rather than trusting that it does.
        run: |
          tz=$(docker run --rm -e TZ=America/New_York --entrypoint date negativespace +%Z)
          echo "container reports TZ=$tz"
          if [ "$tz" = "UTC" ]; then
            echo "::error::TZ was ignored — tzdata is missing from the image"
            exit 1
          fi

      - name: Web interface in a browser
        # Both containers as in docker/compose.yml, driven by headless Chromium through
        # first run, Scan, gallery, Inspector, selection, Copy and settings. On the
        # host because it starts the containers and a Playwright container.
        run: sh tests/browser/webui_browser_test.sh

      - name: Stalled job user decisions
        run: STALLED_FIXTURE=1 DRIVER=stalled_job_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Request counts and job-finish freshness
        run: DRIVER=request_freshness_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Appearance palettes in a browser
        run: DRIVER=appearance_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Gallery photo positioning in a browser
        run: DRIVER=gallery_position_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Similar photo review in a browser
        run: DRIVER=similar_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Rejects in a browser
        run: DRIVER=rejects_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Rejecting from similar photos in a browser
        run: DRIVER=reject_similar_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Synthetic similarity validation
        run: |
          docker run --rm --entrypoint python3 -v "$PWD":/app:ro -w /app \
            negativespace tools/validate-similarity.py --output /tmp/similarity-validation \
            --samples 2 --benchmark-photos 100

      - name: Entrypoint ownership
        # Runs on the host: it checks what the entrypoint does to real bind
        # mounts, which the suite (running after the entrypoint) cannot see.
        run: sh tests/entrypoint_test.sh

      - name: Stopping with a browser open
        # On the host: docker stop against a running app container with a job-feed
        # WebSocket open, as a browser tab holds one. It must stop cleanly and run the
        # app's shutdown, which cancels a running job, rather than be killed at the
        # grace period.
        run: sh tests/shutdown_test.sh

      - name: Sampler path safety
        # Also on the host, and for the same reason: the sampler is a host-side
        # tool whose whole promise is that it never writes into the library it
        # samples. The checks turn on symlinks and physical path resolution, so
        # they need a real filesystem rather than the container's.
        #
        # Nothing ran this script until now, which is how it shipped able to
        # build a sample inside the library through a symlinked root.
        run: sh tests/sampler_test.sh

      - name: Spec cross-references
        # Dangling references have shipped here twice. This exits non-zero, so it
        # blocks rather than informs.
        run: python3 tools/check-specs.py

      - name: Schema drift
        # engine-spec.md 6.5 calls itself the authoritative schema; nothing else
        # keeps that true, so this compares it against what the engine creates.
        run: |
          docker run --rm -v "$PWD":/app -w /app \
            negativespace python3 tools/check-schema-drift.py

      - name: API specification matches the routes
        run: |
          docker run --rm -v "$PWD":/app -w /app \
            negativespace python3 tools/check-api-spec.py

      - name: Instance access policy
        run: docker run --rm --entrypoint python3 -v "$PWD":/app:ro -w /app negativespace -m unittest discover -s tests -p access_test.py -v

      - name: Instance access in a browser
        run: DRIVER=access_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Database contracts
        run: |
          docker run --rm \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD":/app -w /app \
            negativespace python3 -m unittest discover -s tests -p database_test.py -v

      - name: Image decode eligibility
        run: |
          docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app \
            negativespace python3 -m unittest discover -s tests -p import_decode_test.py -v

      - name: Fresh setup in a browser
        run: DRIVER=fresh_start_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Acknowledged banner dismissal in browser
        run: DRIVER=dismissal_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Source failures stay outside Library
        run: DRIVER=source_scope_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Web API
        # The API against a real engine and catalog: jobs run the real engine.
        run: |
          docker run --rm \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD":/app -w /app \
            negativespace python3 -m unittest discover -s tests -p webui_api_test.py -v

      - name: Uncertain file outcomes
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p attention_test.py -v

      - name: Metadata provenance foundation
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_test.py -v

      - name: Embedded EXIF and XMP comparison adapter
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_adapter_test.py -v

      - name: Field-scoped metadata edit planning
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_edits_test.py -v

      - name: Common metadata fields
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_common_fields_test.py -v

      - name: Preservation-aware XMP writing
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_writer_test.py -v

      - name: Verified embedded JPEG working copies
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_embedded_test.py -v

      - name: Embedded metadata priority and primary switching
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_primary_test.py -v

      - name: Embedded JPEG publication and recovery
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_photo_save_test.py -v

      - name: Verified XMP edits and recovery
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_save_test.py -v

      - name: Apply incoming XMP and Return choices
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_incoming_apply_test.py -v

      - name: Incoming XMP alternatives
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_incoming_test.py -v

      - name: Verified photo and XMP pair transfers
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_transfer_test.py -v

      - name: Multiple-sidecar first imports
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_multi_import_test.py -v

      - name: Normal single-sidecar imports
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_import_test.py -v

      - name: Photo and XMP destination relocation
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_relocate_test.py -v

      - name: Confirmed edited-source cleanup
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_source_cleanup_test.py -v

      - name: Metadata writer limits
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_writer_limits_test.py -v

      - name: Earlier metadata reproduction
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_reproduce_test.py -v

      - name: Base metadata composition
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_composition_test.py -v

      - name: Saved metadata decisions
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_decisions_test.py -v

      - name: Index metadata observations
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p metadata_index_test.py -v

      - name: XMP reader and ownership planning
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p xmp_test.py -v

      - name: Generated JPEG content fingerprint experiment
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p jpeg_content_hash_test.py -v

      - name: XMP catalog storage and backup restoration
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p xmp_store_test.py -v

      - name: Copied originals removed outside the app
        run: docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app negativespace python3 -m unittest discover -s tests -p copied_source_test.py -v

      - name: Externally removed original in a browser
        run: DRIVER=copied_source_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: File issue recovery in a browser
        run: SIMILARITY_RECOVERY_FIXTURE=1 DRIVER=attention_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Review decisions
        run: |
          docker run --rm -e PUID=$(id -u) -e PGID=$(id -g) -v "$PWD":/app -w /app \
            negativespace python3 -m unittest discover -s tests -p review_test.py -v

      - name: Needs review in a browser
        run: DRIVER=review_browser_drive.py sh tests/browser/webui_browser_test.sh

      - name: Selection ownership across processes
        run: |
          docker run --rm \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD":/app -w /app \
            negativespace python3 -m unittest discover -s tests -p selection_ownership_test.py -v

      - name: Scenario library
        # tools/make_scenarios.py never writes to its seed folder, and the real
        # engine indexes what it builds as its manifest says.
        run: |
          docker run --rm \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD":/app -w /app \
            negativespace python3 -m unittest discover -s tests -p make_scenarios_test.py -v

      - name: Smoke suite
        # PUID/PGID drop privileges, which is what lets the permission test run
        # at all — as root it skips, and a test that always skips is
        # indistinguishable from one that passes.
        run: |
          docker run --rm \
            -e PUID=$(id -u) -e PGID=$(id -g) \
            -v "$PWD":/app -w /app \
            negativespace python3 tests/engine_smoke_test.py
